<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Словник ІТ-сленгу</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: Arial, sans-serif; background: #eef1f6; color: #1b2340; }
    body.dark { background: #1b2340; color: white; }

    header {
      background: #1b2340; color: white; padding: 30px 20px;
      display: flex; justify-content: space-between; align-items: center;
      flex-wrap: wrap; gap: 15px;
    }
    header h1 { margin: 0; }
    body.dark header { background: #0d1224; }

    .panel {
      max-width: 1100px; margin: 20px auto 0; padding: 0 20px;
      display: flex; flex-wrap: wrap; gap: 10px;
    }
    .panel input { flex: 1 1 200px; padding: 10px; font-size: 16px; }
    .panel button { padding: 10px 16px; font-size: 16px; cursor: pointer; }

    #cards {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 20px; max-width: 1100px; margin: 0 auto; padding: 20px;
    }
    .card { background: white; color: #1b2340; padding: 20px; border-radius: 10px; border-top: 6px solid #2f4bff; }
    .card h2 { margin: 0 0 5px; }
    .card .example { background: #eef1f6; border-left: 4px solid #ffd84d; padding: 8px 10px; }
    .card.active { background: #fff3b0; }

    #message { text-align: center; padding: 10px; }

    @media (max-width: 600px) {
      header { flex-direction: column; text-align: center; }
      #cards { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header>
    <h1>Словник ІТ-сленгу</h1>
    <button id="themeBtn">Темна тема</button>
  </header>

  <div class="panel">
    <input type="text" id="search" placeholder="Пошук терміна...">
    <button id="randomBtn">Випадковий термін</button>
  </div>

  <div class="panel">
    <input type="text" id="newTerm" placeholder="Новий термін">
    <input type="text" id="newMeaning" placeholder="Пояснення">
    <button id="addBtn">Додати</button>
  </div>

  <p id="message"></p>
  <div id="cards"></div>

  <script>
    // 1. Дані: масив об'єктів
    let terms = [
      { name: "Баг", meaning: "Помилка в програмі.", example: "Кнопка не натискається — це баг." },
      { name: "Фіча", meaning: "Нова можливість продукту.", example: "Темна тема — нова фіча." },
      { name: "Костиль", meaning: "Швидке, але негарне рішення.", example: "Поки зробив костиль." },
      { name: "Легасі", meaning: "Старий код без документації.", example: "Цей модуль — легасі з 2012 року." },
      { name: "Деплой", meaning: "Публікація нової версії програми.", example: "Деплой о 18:00." },
      { name: "Дедлайн", meaning: "Крайній термін виконання завдання.", example: "Дедлайн у п'ятницю." },
      { name: "Джун", meaning: "Початківець у професії.", example: "У нас двоє джунів." },
      { name: "Сіньйор", meaning: "Досвідчений розробник.", example: "Спитай у сіньйора." }
    ];

    // 2. Доступ до елементів DOM
    const cardsBox = document.getElementById("cards");
    const search = document.getElementById("search");
    const message = document.getElementById("message");

    // 3. Функція створення картки (динамічне створення елементів)
    function createCard(term) {
      const card = document.createElement("div");
      card.className = "card";
      card.innerHTML =
        "<h2>" + term.name + "</h2>" +
        "<p>" + term.meaning + "</p>" +
        "<p class='example'>«" + term.example + "»</p>";

      // подія наведення миші
      card.addEventListener("mouseover", function () {
        card.style.borderTopColor = "#e53e5c";
      });
      card.addEventListener("mouseout", function () {
        card.style.borderTopColor = "#2f4bff";
      });
      return card;
    }

    // 4. Показ списку карток
    function showCards(list) {
      cardsBox.innerHTML = "";
      list.forEach(function (term) {
        cardsBox.appendChild(createCard(term));
      });
      message.textContent = "Знайдено термінів: " + list.length;
      console.log("Показано карток:", list.length);
    }

    // 5. Пошук (подія введення тексту)
    search.addEventListener("input", function () {
      const text = search.value.toLowerCase();
      const found = terms.filter(function (t) {
        return t.name.toLowerCase().includes(text);
      });
      showCards(found);
    });

    // 6. Випадковий термін (зміна стилю елемента)
    document.getElementById("randomBtn").addEventListener("click", function () {
      showCards(terms);
      const all = document.querySelectorAll(".card");
      const i = Math.floor(Math.random() * all.length);
      all[i].classList.add("active");
      all[i].scrollIntoView({ behavior: "smooth", block: "center" });
      console.log("Випадковий термін:", terms[i].name);
    });

    // 7. Додавання нового терміна
    document.getElementById("addBtn").addEventListener("click", function () {
      const name = document.getElementById("newTerm").value.trim();
      const meaning = document.getElementById("newMeaning").value.trim();

      if (name === "" || meaning === "") {
        alert("Заповніть обидва поля!");
        return;
      }
      terms.push({ name: name, meaning: meaning, example: "—" });
      showCards(terms);
      document.getElementById("newTerm").value = "";
      document.getElementById("newMeaning").value = "";
      console.log("Додано термін:", name);
    });

    // 8. Темна тема (клік по кнопці)
    document.getElementById("themeBtn").addEventListener("click", function () {
      document.body.classList.toggle("dark");
    });

    // Початковий показ
    showCards(terms);
  </script>
</body>
</html>
